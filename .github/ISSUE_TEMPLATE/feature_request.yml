name: Feature request
description: Suggest a new feature, data source or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and why is it not possible or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the feature to work? Code sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be interested in contributing this feature (see CONTRIBUTING.md).
